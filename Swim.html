    <script>
      function inhabilitar(){
          alert ("NO")
          return false
      }
      
      document.oncontextmenu = inhabilitar
    // JavaScript to update overlay text and keep an image visible
      document.addEventListener('DOMContentLoaded', () => {
          const card = document.querySelector('.card');
          const text = document.querySelector('.overlay-text');
          const images = document.querySelectorAll('.card img');
          let currentImageIndex = 0; // Track the currently visible image

          // Set the first image as visible by default
          images[0].style.opacity = 1;

          card.addEventListener('mousemove', (e) => {
              const rect = card.getBoundingClientRect();
              const x = e.clientX - rect.left;
              const index = Math.floor((x / rect.width) * 120);
              images.forEach((img, i) => {
                  img.style.opacity = i === index ? 1 : 0;
              });
              currentImageIndex = index; // Update the current image index
              text.textContent = ``;
          });

         // Ensure an image stays visible when mouse leaves
          card.addEventListener('mouseleave', () => {
              images.forEach((img, i) => {
                  img.style.opacity = i === currentImageIndex ? 1 : 0;
              });
          });
      });
      
document.addEventListener('DOMContentLoaded', () => {
        const card = document.querySelector('.card');
        const images = document.querySelectorAll('.card img');
        const playBtn = document.querySelector('#playBtn');
        const stopBtn = document.querySelector('#stopBtn');
        let currentImageIndex = 0;
        let autoPlayInterval = null;

        if (images.length !== 120) {
            console.error('Expected 120 images, found:', images.length);
        }

        images[0].style.opacity = 1;
        stopBtn.disabled = true; // Deshabilitar el botón "Stop" al inicio

        // Función para cambiar imágenes
        const updateImage = (index) => {
            images.forEach((img, i) => {
                img.style.opacity = i === index ? 1 : 0;
            });
            currentImageIndex = index;
        };

        // Lógica de animación automática
        const startAutoPlay = () => {
            if (!autoPlayInterval) {
                autoPlayInterval = setInterval(() => {
                    currentImageIndex = (currentImageIndex + 1) % images.length; // Ciclo circular
                    updateImage(currentImageIndex);
                }, 120); // Cambia cada 120ms
                playBtn.disabled = true;
                stopBtn.disabled = false;
            }
        };

        const stopAutoPlay = () => {
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
                playBtn.disabled = false;
                stopBtn.disabled = true;
            }
        };

        // Evento para el botón Play
        playBtn.addEventListener('click', startAutoPlay);

        // Evento para el botón Stop
        stopBtn.addEventListener('click', stopAutoPlay);

        // Detener animación al interactuar con el mouse
        let timeout;
        card.addEventListener('mousemove', (e) => {
            stopAutoPlay(); // Detener animación automática
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const index = Math.min(Math.floor((x / rect.width) * images.length), images.length - 1);
                updateImage(index);
            }, 10);
        });

        card.addEventListener('mouseleave', () => {
            updateImage(currentImageIndex);
        });

        // Soporte para teclado
        card.addEventListener('keydown', (e) => {
            stopAutoPlay(); // Detener animación automática
            if (e.key === 'ArrowLeft' && currentImageIndex > 0) {
                currentImageIndex--;
            } else if (e.key === 'ArrowRight' && currentImageIndex < images.length - 1) {
                currentImageIndex++;
            }
            updateImage(currentImageIndex);
        });

        // Soporte para touch (opcional, para dispositivos móviles)
        card.addEventListener('touchmove', (e) => {
            stopAutoPlay(); // Detener animación automática
            e.preventDefault();
            const touch = e.touches[0];
            const rect = card.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const index = Math.min(Math.floor((x / rect.width) * images.length), images.length - 1);
            updateImage(index);
        });
    });
    </script>
